<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seal Desktop Companion</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <img src="icons/icon32.png" alt="Seal" class="brand-logo" id="brand-logo">
        <div class="brand-text">
          <span class="brand-name">Seal Desktop</span>
          <span class="brand-tag">Companion</span>
        </div>
      </div>
      <div class="status-badge" id="status-badge" title="Connection to local Seal Desktop app">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-label" id="status-label">Checking...</span>
      </div>
    </header>

    <!-- Offline Alert Banner (shown only when Seal Desktop is not running) -->
    <div class="offline-banner" id="offline-banner" style="display: none;">
      <div class="offline-banner-text">
        <span>⚠️ Seal Desktop is not detected.</span>
        <small>Make sure the app is running with companion server enabled.</small>
      </div>
      <button class="btn-sm" id="btn-retry-conn" title="Retry Connection">🔄 Retry</button>
    </div>

    <!-- Active Media / Link Card -->
    <div class="card media-card">
      <div class="media-header">
        <div class="platform-badge" id="platform-badge">🌐 Web</div>
        <span class="media-title" id="media-title">Fetching current page...</span>
      </div>
      <div class="url-input-wrap">
        <input type="text" id="media-url" class="input-url" placeholder="Paste or detect video URL..." spellcheck="false" />
        <button id="btn-paste-url" class="btn-icon" title="Paste from clipboard">📋</button>
      </div>
    </div>

    <!-- Download Configuration -->
    <div class="card options-card">
      <!-- Mode Toggle: Video vs Audio -->
      <div class="segmented-control">
        <button class="segment-btn active" id="tab-video" data-mode="video">
          <span class="icon">🎬</span> Video
        </button>
        <button class="segment-btn" id="tab-audio" data-mode="audio">
          <span class="icon">🎵</span> Audio Only
        </button>
      </div>

      <!-- Video Options (shown in Video mode) -->
      <div class="mode-options" id="video-options">
        <div class="form-row">
          <label for="video-quality" class="form-label">Quality</label>
          <select id="video-quality" class="form-select">
            <option value="best" selected>⚡ Best Available (Auto)</option>
            <option value="2160">4K Ultra HD (2160p)</option>
            <option value="1440">2K QHD (1440p)</option>
            <option value="1080">Full HD (1080p)</option>
            <option value="720">HD (720p)</option>
            <option value="480">Standard (480p)</option>
            <option value="360">Low (360p)</option>
          </select>
        </div>
        <div class="form-row">
          <label for="video-format" class="form-label">Format</label>
          <select id="video-format" class="form-select">
            <option value="mp4" selected>MP4 (Universal)</option>
            <option value="mkv">MKV (Matroska)</option>
          </select>
        </div>
      </div>

      <!-- Audio Options (shown in Audio mode) -->
      <div class="mode-options" id="audio-options" style="display: none;">
        <div class="form-row">
          <label for="audio-format" class="form-label">Audio Format</label>
          <select id="audio-format" class="form-select">
            <option value="mp3" selected>MP3 (320kbps)</option>
            <option value="m4a">M4A / AAC</option>
            <option value="opus">OPUS (High efficiency)</option>
            <option value="flac">FLAC (Lossless)</option>
            <option value="wav">WAV (Uncompressed)</option>
          </select>
        </div>
      </div>

      <!-- Quick Toggles -->
      <div class="toggles-grid">
        <label class="checkbox-label" id="subs-label">
          <input type="checkbox" id="embed-subs" />
          <span class="checkbox-custom"></span>
          <span>Embed Subtitles</span>
        </label>
        <label class="checkbox-label" id="meta-label">
          <input type="checkbox" id="embed-meta" checked />
          <span class="checkbox-custom"></span>
          <span>Thumbnail & Tags</span>
        </label>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="actions-group">
      <button class="btn btn-primary" id="btn-download-now">
        <span class="btn-icon">⚡</span>
        <span class="btn-text">Download Now</span>
      </button>
      <button class="btn btn-secondary" id="btn-add-queue">
        <span class="btn-icon">➕</span>
        <span class="btn-text">Add to Queue</span>
      </button>
    </div>

    <!-- Fallback Button (visible when offline) -->
    <button class="btn btn-outline" id="btn-copy-fallback" style="display: none;">
      <span>📋 Copy URL to Clipboard (for Seal Monitor)</span>
    </button>

    <!-- Feedback Banner / Toast -->
    <div class="toast-banner" id="toast-banner" style="display: none;">
      <span class="toast-icon" id="toast-icon">✅</span>
      <span class="toast-msg" id="toast-msg">Added to Seal Desktop!</span>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-left">
        <span class="version-label">v1.0.0</span>
        <span class="dot-separator">•</span>
        <span class="queue-stat" id="queue-stat">Queue: 0 items</span>
      </div>
      <div class="footer-right">
        <button class="btn-icon-link" id="btn-open-options" title="Settings">⚙️</button>
        <a href="https://github.com/Youcef-fareh/seal-desk" target="_blank" class="btn-icon-link" title="GitHub Project">⭐</a>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
